version: '3.8'
services:
  backend:
    build: .
    command: npm run test
    container_name: libary-management-backend
    ports:
      - "5000:5000"
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    networks:
      - app-network

  
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - app-network
    
networks:
  app-network:

